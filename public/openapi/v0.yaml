---
openapi: 3.2.0
info:
  title: Register of training providers API
  version: v0
servers: []
paths:
  "/api/{api_version}/info":
    get:
      summary: Provides general information about the API
      tags:
      - Info
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: test_fbeaab741142c00560093790fcd4915db92e981d3af02539f40b9f211240a67f
        description: A valid API token must be provided in the Authorization header
          to access this endpoint.
      - name: api_version
        in: path
        required: true
        schema:
          type: string
        example: v0
        description: |
          The API version to use in the request path.
          This should be set to the latest version for this endpoint.
      responses:
        '200':
          description: returns the requested and latest API version and status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The status of the request.
                    example: ok
                  version:
                    type: object
                    properties:
                      requested:
                        type: string
                        description: The requested API version.
                        example: v0
                      latest:
                        type: string
                        description: The latest available API version.
                        example: v0
                    required:
                    - requested
                    - latest
                required:
                - status
                - version
              example:
                status: ok
                version:
                  requested: v0
                  latest: v0
        '401':
          description: returns 401 Unauthorized for invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
              example:
                error: Unauthorized
      description: This endpoint can be used to retrieve general information about
        the API.
  "/api/{api_version}/providers":
    get:
      summary: Get many providers
      tags:
      - providers
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: test_d27443581310a59525f0323fffe9412db849fec901beb840cb021c65b273f171
        description: A valid API token must be provided in the Authorization header
          to access this endpoint.
      - name: academic_year
        in: query
        required: false
        schema:
          type: integer
        example: 2026
        description: |
          Filters providers by the specified academic year.
          The value must be a 4-digit year, for example 2025.

          If not provided, the API will return providers active in the current academic year.
      - name: api_version
        in: path
        required: true
        schema:
          type: string
        example: v0
        description: |
          The API version to use in the request path.
          This should be set to the latest version for this endpoint.
      - name: changed_since
        in: query
        required: false
        schema:
          type: string
        example: '2026-09-14T11:34:56Z'
        description: |
          Filters providers to only those updated after the specified timestamp.
          The value must be an ISO 8601 datetime, for example: 2025-09-14T11:34:56Z.
      responses:
        '200':
          description: returns an array of training providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        operating_name:
                          type: string
                          description: The primary business or operating name of the
                            training provider.
                          example: Bobby Jacob University
                        provider_type:
                          type: string
                          description: The classification of the provider.
                          enum:
                          - hei
                          - scitt
                          - school
                          - other
                          example: hei
                        code:
                          type: string
                          description: The unique 3-character identifier code for
                            the provider.
                          example: 1BJ
                        accreditation_status:
                          type: string
                          description: The current accreditation status of the provider.
                          enum:
                          - accredited
                          - unaccredited
                          example: accredited
                        ukprn:
                          type: string
                          description: The 8-digit UK Provider Reference Number.
                          example: '77336264'
                        urn:
                          type:
                          - string
                          - 'null'
                          description: The 5 or 6 digit Unique Reference Number. Optional
                            for all provider types; returned as null when no URN is
                            recorded.
                          example: '543380'
                        updated_at:
                          type: string
                          description: The ISO 8601 timestamp of when the provider
                            record was last modified.
                          format: date-time
                          example: '2025-09-15T11:34:56Z'
                        rotp_id:
                          type:
                          - string
                          - 'null'
                          description: The unique Register of training provider identifier.
                          example: RoTP-00A0BC00
                      required:
                      - operating_name
                      - provider_type
                      - code
                      - accreditation_status
                      - ukprn
                      - urn
                      - updated_at
                    description: An array of training provider objects matching the
                      specified filters.
                required:
                - data
              example:
                data:
                - rotp_id: RoTP-26C6QI09
                  operating_name: Higher education institution (HEI) 4270
                  provider_type: hei
                  code: LVI
                  accreditation_status: unaccredited
                  ukprn: '66967363'
                  urn: '73040'
                  updated_at: '2026-09-15T11:34:56Z'
                - rotp_id: RoTP-26D0IA09
                  operating_name: Higher education institution (HEI) 7244
                  provider_type: hei
                  code: IQX
                  accreditation_status: accredited
                  ukprn: '29257567'
                  urn: '483494'
                  updated_at: '2026-09-15T11:34:56Z'
                - rotp_id: RoTP-26K8HH09
                  operating_name: Other 4502
                  provider_type: other
                  code: 1ZV
                  accreditation_status: unaccredited
                  ukprn: '13681317'
                  urn: '396629'
                  updated_at: '2026-09-15T11:34:56Z'
                - rotp_id: RoTP-26F9CK09
                  operating_name: Other 5710
                  provider_type: other
                  code: 7BX
                  accreditation_status: accredited
                  ukprn: '13858851'
                  urn: '98144'
                  updated_at: '2026-09-15T11:34:56Z'
                - rotp_id: RoTP-26F1DI09
                  operating_name: School 6728
                  provider_type: school
                  code: JN8
                  accreditation_status: unaccredited
                  ukprn: '88489798'
                  urn: '179880'
                  updated_at: '2026-09-15T11:34:56Z'
                - rotp_id: RoTP-26K4CJ09
                  operating_name: School-centred initial teacher training (SCITT)
                    3180
                  provider_type: scitt
                  code: HT4
                  accreditation_status: accredited
                  ukprn: '19407537'
                  urn:
                  updated_at: '2026-09-15T11:34:56Z'
                - rotp_id: RoTP-26V5XY09
                  operating_name: School-centred initial teacher training (SCITT)
                    6787
                  provider_type: scitt
                  code: O3Y
                  accreditation_status: accredited
                  ukprn: '82228738'
                  urn: '577270'
                  updated_at: '2026-09-15T11:34:56Z'
        '401':
          description: returns 401 Unauthorized for invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
              example:
                error: Unauthorized
      description: |
        This endpoint can be used to retrieve providers for a given academic year.
        This is intended to make it possible to check for new or updated providers regularly.
